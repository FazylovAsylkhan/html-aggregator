services:
  db:
    image: postgres:17.0
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: none
    volumes:
      - db-data:/var/lib/postgresql/data
  app:
    image: html-aggregator
    ports:
      - "8080:8080"
    command: ["/usr/local/bin/app"]
    build: 
      context: ./
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      SERVER_ADDRESS: ${ADDRESS}
      PARSING_BASE_URL: ${PARSING_BASE_URL}

volumes:
  db-data: